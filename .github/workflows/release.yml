name: Build and Release macOS

on:
  push:
    tags:
      - 'v*-macos'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: |
          python3 -m unittest discover -s . -p 'test_quota_guard.py' -q
          swiftc -DSETTINGS_MODEL_TEST SettingsSaveTests.swift CodexQuotaGuardSettings.swift -o "$RUNNER_TEMP/settings-tests"
          "$RUNNER_TEMP/settings-tests"
      - name: Build and verify
        run: |
          ./build_settings_app.sh
          codesign --verify --deep --strict CodexQuotaGuardSettings.app
          test "$(plutil -extract CFBundleVersion raw -o - CodexQuotaGuardSettings.app/Contents/Info.plist)" = 29
          lipo CodexQuotaGuardSettings.app/Contents/MacOS/CodexQuotaGuardSettings -verify_arch arm64
          test -s CodexQuotaGuardSettings.app/Contents/Resources/AppIcon.icns
      - name: Package
        run: |
          mkdir -p release-assets/CodexQuotaGuard
          ditto CodexQuotaGuardSettings.app release-assets/CodexQuotaGuard/CodexQuotaGuardSettings.app
          cp codex_quota_guard.py config.example.json LaunchAgent.template.plist README.md release-assets/CodexQuotaGuard/
          ditto -c -k --sequesterRsrc --keepParent release-assets/CodexQuotaGuard release-assets/CodexQuotaGuard-macOS-arm64-Build29.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release-assets/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-assets
      - name: Publish latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/*.zip --verify-tag --latest --title "Codex Quota Guard 1.0 — Build 29" --notes-file RELEASE_NOTES.md
